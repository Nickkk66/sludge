<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
<title>Sludge — reading</title>
<style>
  :root {
    --bg: rgba(18, 20, 24, .94);
    --fg: #e8eaee;
    --fg-2: #a7adb8;
    --fg-3: #767d89;
    --line: #383d46;
    --accent: #ff6a3d;
    --size: 26px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #shell {
    height: 100%;
    background: var(--bg);
    backdrop-filter: blur(18px);
    border: 1px solid var(--line);
    border-radius: 14px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #bar {
    -webkit-app-region: drag;
    flex: none; height: 30px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 6px 0 12px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  #bar .title { flex: 1; color: var(--fg-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar button {
    -webkit-app-region: no-drag;
    background: none; border: none; color: var(--fg-3);
    width: 24px; height: 22px; border-radius: 5px; cursor: pointer;
    font-size: 12px; display: flex; align-items: center; justify-content: center;
  }
  #bar button:hover { background: rgba(255,255,255,.12); color: var(--fg); }
  #bar svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  #line {
    flex: 1; min-height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 14px 18px;
    text-align: center;
    font-size: var(--size); line-height: 1.5;
    color: var(--fg-2);
  }
  .w { border-radius: 5px; padding: 0 2px; transition: color .08s, background .08s; }
  .w.said { color: var(--fg-3); }
  .w.now { color: #fff; background: var(--accent); box-shadow: 0 0 0 3px var(--accent); }

  #foot {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-top: 1px solid rgba(255,255,255,.06);
    color: var(--fg-3); font-size: 11px;
  }
  #meta { flex: none; font-variant-numeric: tabular-nums; }
  #progress { flex: 1; height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  #progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #left { flex: none; font-variant-numeric: tabular-nums; }
  #idle { color: var(--fg-3); font-size: 13px; }
</style>
</head>
<body>
<div id="shell">
  <div id="bar">
    <span class="title">Sludge</span>
    <button id="smaller" title="Smaller text">A−</button>
    <button id="bigger" title="Bigger text">A+</button>
    <button id="playPause" title="Play / pause">
      <svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>
    </button>
    <button id="dock" title="Put it back in the window">
      <svg viewBox="0 0 24 24"><path d="M14 10L20 4M20 4h-5M20 4v5"/><path d="M10 20H5a1 1 0 01-1-1v-5"/><rect x="4" y="4" width="7" height="7" rx="1"/></svg>
    </button>
  </div>
  <div id="line"><span id="idle">Nothing is being read right now.</span></div>
  <div id="foot">
    <span id="meta"></span>
    <div id="progress"><i></i></div>
    <span id="left"></span>
  </div>
</div>
<script src="js/popout.js"></script>
</body>
</html>
